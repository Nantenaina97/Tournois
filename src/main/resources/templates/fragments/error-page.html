<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:fragment="page(code, title, hint)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${code} + ' — ' + ${title}">Erreur</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="login-page">
    <div class="login-card text-center">
        <div style="font-size:56px; font-weight:800; color:var(--primary);" th:text="${code}">404</div>
        <h1 th:text="${title}">Erreur</h1>
        <p class="text-muted" th:text="${message} ?: ${hint}">Une erreur est survenue.</p>
        <div class="help-text" th:if="${errorLabel}" th:text="${errorLabel}"></div>
        <div class="btn-row" style="justify-content:center; margin-top:22px;">
            <a class="btn" th:href="@{/dashboard}">Tableau de bord</a>
            <a class="btn btn-outline" th:href="@{/tournaments}">Tournois</a>
        </div>
    </div>
</div>
</body>
</html>
