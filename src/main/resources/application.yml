server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: tournament-management

  datasource:
    url: jdbc:h2:mem:tournament;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    # Les vues Thymeleaf affichent des entités (équipes, joueurs, matchs liés).
    # L'Open Session In View maintient la session Hibernate ouverte pendant le rendu ;
    # l'API REST, elle, ne renvoie que des DTO et n'en dépend pas.
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: UTC
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

  thymeleaf:
    cache: false
    encoding: UTF-8

  mvc:
    problemdetails:
      enabled: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  web:
    locale: fr
    locale-resolver: fixed

logging:
  level:
    org.hibernate.SQL: warn
    com.example.tournament: info
